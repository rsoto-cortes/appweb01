{% extends 'layout.html' %}

{% block content %}
  <div class="container-fluid">
    <h1>Productos</h1>
    <p>{{ message }}</p>
    <p>Estos son los productos que ofrecemos.</p>
  </div>

  <div id="carouselExampleControls" class="carousel slide mi-carrusel" data-ride="carousel">
    <div class="carousel-inner">
      <div class="carousel-item active">
        <img src="{{ url_for('static', filename='img/productos/pan.jpg') }}" class="d-block w-100" alt="Pan de muertos" />
      </div>

      <div class="carousel-item">
        <img src="{{ url_for('static', filename='img/productos/papel.jpg') }}" class="d-block w-100" alt="Papel picado" />
      </div>

      <div class="carousel-item">
        <img src="{{ url_for('static', filename='img/productos/taza.jpg') }}" class="d-block w-100" alt="Taza de muertos" />
      </div>
    </div>

    <a class="carousel-control-prev" href="#carouselExampleControls" role="button" data-slide="prev"><span class="carousel-control-prev-icon" aria-hidden="true"></span></a>

    <a class="carousel-control-next" href="#carouselExampleControls" role="button" data-slide="next"><span class="carousel-control-next-icon" aria-hidden="true"></span></a>
  </div>
{% endblock %}
