{% extends 'layout.html' %}

{% block content %}
  <div class="container-fluid">
    <h1>Servicios</h1>
    <p>{{ message }}</p>
    <p>Estos son los servicios que ofrecemos.</p>

    <div class="card servicios-card">
      <img
        src="{{ url_for('static', filename='img/calaverita.png') }}"
        class="card-img-top servicios-card-img"
        alt="Calaverita decorativa del Día de Muertos"
      />
      <div class="card-body">
        <h2 class="card-title h4">Celebra el Día de Muertos</h2>
        <p class="card-text">
          Encuentra productos y detalles para preparar esta celebración.
        </p>
        <a href="{{ url_for('productos') }}" class="btn btn-primary">Ver productos</a>
      </div>
    </div>
  </div>
{% endblock %}
